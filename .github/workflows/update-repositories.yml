name: Update repository list

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Update public repositories section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: Pavithrasaidula
        run: |
          python - <<'PY'
          import json, os, re, urllib.request

          username = os.environ["GH_USERNAME"]
          token = os.environ["GH_TOKEN"]
          request = urllib.request.Request(
              f"https://api.github.com/users/{username}/repos?type=owner&sort=updated&per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              repos = json.load(response)

          lines = []
          for repo in repos:
              if repo.get("private") or repo.get("archived"):
                  continue
              name = repo["name"]
              url = repo["html_url"]
              description = (repo.get("description") or "").strip()
              suffix = f" — {description}" if description else ""
              lines.append(f"- [{name}]({url}){suffix}")

          readme_path = "README.md"
          with open(readme_path, encoding="utf-8") as file:
              readme = file.read()

          start = "<!-- REPOSITORIES:START -->"
          end = "<!-- REPOSITORIES:END -->"
          replacement = start + "\n" + ("\n".join(lines) if lines else "_No public repositories found yet._") + "\n" + end
          updated = re.sub(re.escape(start) + r".*?" + re.escape(end), replacement, readme, flags=re.S)

          if updated == readme:
              print("Repository list is already up to date.")
          else:
              with open(readme_path, "w", encoding="utf-8") as file:
                  file.write(updated)
              print("Updated repository list.")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update public repository list"
          git push
